(()=>{'use strict';const KEY='form-workout-studio-v1';const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());const localDate=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const sample=[{id:uid(),name:'Full Body Strength',category:'Strength',favorite:true,exercises:[{id:uid(),name:'Squats',sets:3,reps:'10',weight:'',rest:90},{id:uid(),name:'Push-ups',sets:3,reps:'12',weight:'',rest:60},{id:uid(),name:'Bent-over Rows',sets:3,reps:'10',weight:'',rest:75}]},{id:uid(),name:'Leg Day Burner',category:'Bodyweight',favorite:true,exercises:[{id:uid(),name:'Bodyweight Squats',sets:4,reps:'25',weight:'',rest:45},{id:uid(),name:'Reverse Lunges',sets:3,reps:'12/leg',weight:'',rest:45},{id:uid(),name:'Calf Raises',sets:3,reps:'20',weight:'',rest:30}]},{id:uid(),name:'Core & Mobility',category:'Mobility',favorite:false,exercises:[{id:uid(),name:'Plank',sets:3,reps:'45 sec',weight:'',rest:30},{id:uid(),name:'Dead Bug',sets:3,reps:'12/side',weight:'',rest:30},{id:uid(),name:'Hip Flexor Stretch',sets:2,reps:'60 sec/side',weight:'',rest:15}]}];let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.workouts)||!Array.isArray(data.history))data={workouts:sample,history:[],active:null};data.activityTypes=Array.isArray(data.activityTypes)?data.activityTypes:[];data.history.forEach(h=>{if(h.manual&&h.category&&!data.activityTypes.some(c=>c.toLowerCase()===h.category.toLowerCase()))data.activityTypes.push(h.category)});let tab='dashboard',month=new Date();month.setDate(1);let selected=localDate();let favOnly=false;let insightRange='14';let trendWeeks='12';let pendingRating=7;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Browser storage is full or unavailable. Export a backup.')}};const challengeRecipes=[{name:'Thigh Burner',category:'Strength',favorite:false,notes:'Rest as needed. No weights. Each lunge count is per leg. Complete the pyramid from 5 up to 25 and back down to 5. 500 total repetitions.',exercises:[5,10,15,20,25,20,15,10,5].flatMap((reps,i)=>[{name:`Round ${i+1} · Lunges (each leg)`,sets:1,reps:String(reps),weight:'No weights',rest:60},{name:`Round ${i+1} · Squats`,sets:1,reps:String(reps),weight:'No weights',rest:60},{name:`Round ${i+1} · Jump Squats`,sets:1,reps:String(reps),weight:'No weights',rest:60}])},{name:'Hotel Room Workout',category:'Strength',favorite:false,notes:'No equipment required. The no-excuses workout while travelling.',exercises:[{name:'Squats',sets:1,reps:'300',weight:'Bodyweight',rest:60},{name:'Sit-ups',sets:1,reps:'200',weight:'Bodyweight',rest:60},{name:'Push-ups',sets:1,reps:'100',weight:'Bodyweight',rest:60},{name:'Jump Squats',sets:1,reps:'50',weight:'Bodyweight',rest:60}]},{name:'The Murph',category:'Strength',favorite:false,notes:'1 mile run, 100 pull-ups, 200 push-ups, 300 air squats, 1 mile run. Optional 20 lb weighted vest adds 25 points.',exercises:[{name:'Run',sets:1,reps:'1 mile',weight:'',rest:0},{name:'Pull-ups',sets:1,reps:'100',weight:'',rest:60},{name:'Push-ups',sets:1,reps:'200',weight:'',rest:60},{name:'Air Squats',sets:1,reps:'300',weight:'',rest:60},{name:'Run',sets:1,reps:'1 mile',weight:'',rest:0}]}];const ensureChallengeRecipes=()=>{let changed=false;for(const recipe of challengeRecipes){if(!data.workouts.some(w=>w.name.toLowerCase()===recipe.name.toLowerCase())){data.workouts.push({id:uid(),...structuredClone(recipe),exercises:recipe.exercises.map(e=>({id:uid(),...e}))});changed=true}}if(changed)save()};ensureChallengeRecipes();const activityCategories=()=>[...new Set([...data.activityTypes,...data.history.filter(h=>h.manual).map(h=>h.category)].filter(Boolean))].sort((a,b)=>a.localeCompare(b));const activityRules={'swimming':{name:'Swimming',unit:'km',rate:20.625},'outdoor run':{name:'Outdoor Run',unit:'km',rate:5},'running':{name:'Outdoor Run',unit:'km',rate:5},'run':{name:'Outdoor Run',unit:'km',rate:5},'outdoor cycling':{name:'Outdoor Cycling',unit:'km',rate:1.625},'cycling':{name:'Outdoor Cycling',unit:'km',rate:1.625},'rowing':{name:'Rowing',unit:'km',rate:3.75},'surfing':{name:'Surfing',unit:'min',rate:.6},'burpee challenge':{name:'Burpee Challenge',unit:'burpees',rate:.5},'hiking':{name:'Hiking',unit:'km',rate:2.5},'hi-intensity cardio':{name:'Hi-Intensity Cardio',unit:'min',rate:.9},'high-intensity cardio':{name:'Hi-Intensity Cardio',unit:'min',rate:.9},'strength':{name:'Strength',unit:'min',rate:.6},'leg strength':{name:'Strength',unit:'min',rate:.6},'upper-body strength':{name:'Strength',unit:'min',rate:.6},'upper body strength':{name:'Strength',unit:'min',rate:.6},'yoga':{name:'Yoga / Stretching',unit:'min',rate:.4},'stretching':{name:'Yoga / Stretching',unit:'min',rate:.4},'yoga / stretching':{name:'Yoga / Stretching',unit:'min',rate:.4},'the murph':{name:'The Murph',fixed:80},'murph':{name:'The Murph',fixed:80},'thigh burner':{name:'Thigh Burner',fixed:60},'hotel room workout':{name:'Hotel Room Workout',fixed:50},'retro abs bonus':{name:'Retro Abs Bonus',fixed:15}};const ruleFor=name=>activityRules[String(name||'').trim().toLowerCase()]||null;const pointsFor=h=>{if(Number.isFinite(Number(h.pointsAwarded)))return Number(h.pointsAwarded);const namedRule=ruleFor(h.name),categoryRule=ruleFor(h.category);const r=namedRule?.fixed?namedRule:(categoryRule||namedRule);if(!r)return 0;if(r.fixed)return r.fixed+(r.name==='The Murph'&&h.weightedVest?25:0);let amount=0;if(r.unit==='min')amount=Number(h.durationMin)||0;else if(r.unit==='burpees')amount=Number(h.burpees)||0;else if(r.unit==='km'){if(h.distanceUnit==='mi')amount=(Number(h.distanceValue)||Number(h.distanceMi)||0)*1.6;else amount=Number(h.distanceKm)||Number(h.distanceValue)||(Number(h.distanceMi)||0)*1.6;}return amount*r.rate};const sessionDetail=h=>`${Number(h.duratio
