<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Statue of Dave</title><meta name="theme-color" content="#101321"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"><style>
:root{--bg:#101321;--panel:#1a1e30;--panel2:#22273c;--text:#f8f8ff;--muted:#a5abc4;--line:#34394f;--pink:#fa70a6;--lime:#c6f477;--purple:#aa92ff;--blue:#76d8f9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% -10%,#342b59 0,transparent 40%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.shell{max-width:1180px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand{font-size:28px;font-weight:900;letter-spacing:-1.5px}.brand span{color:var(--lime)}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:800}.tabs{display:flex;gap:6px;flex-wrap:wrap;background:#1b1f30;padding:5px;border-radius:16px}.tabs button{border:0;background:transparent;color:var(--muted);padding:10px 15px;border-radius:12px}.tabs button.active{background:var(--purple);color:#151323;font-weight:800}.hero{margin:32px 0 22px;background:linear-gradient(120deg,#b59aff,#ef85bd);color:#191427;padding:30px;border-radius:24px;display:flex;justify-content:space-between;align-items:center;gap:15px}.hero h1{font-size:clamp(27px,4vw,44px);letter-spacing:-1.5px;line-height:1.1;margin:8px 0}.hero p{margin:0;opacity:.8}.hero .btn{background:#191427;color:white}.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--lime);color:#141820;font-weight:800}.btn.secondary{background:#343a53;color:white}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.btn.danger{background:#ff8494;color:#25131b}.btn.small{padding:7px 11px;font-size:13px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:25px 0 14px}.sectionhead h2{font-size:22px;letter-spacing:-.6px;margin:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card,.stat{background:var(--panel);border:1px solid #30354a;border-radius:19px;padding:19px}.stat .number{font-size:32px;font-weight:900;letter-spacing:-1px;margin:7px 0}.stat:nth-child(2) .number{color:var(--lime)}.stat:nth-child(3) .number{color:var(--pink)}.stat:nth-child(4) .number{color:var(--blue)}.workout-card{display:flex;flex-direction:column;gap:13px;min-height:230px}.workout-card .actions{margin-top:auto;display:flex;gap:7px;flex-wrap:wrap}.workout-card h3{font-size:21px;margin:0}.workout-card p{color:var(--muted);margin:0}.pill{display:inline-block;background:#33304f;color:#d8caff;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800}.fav{border:0;background:transparent;color:#727a96;font-size:25px;line-height:1}.fav.on{color:var(--pink)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:var(--muted)}.hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:40px 10px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.dayname{text-align:center;color:var(--muted);font-size:12px;padding:8px}.day{min-height:83px;border:1px solid var(--line);background:#20253a;border-radius:11px;padding:8px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;color:var(--text);text-align:left}.day.other{opacity:.28}.day.today{border-color:var(--lime)}.day.selected{outline:2px solid var(--purple)}.dot{width:7px;height:7px;border-radius:50%;background:var(--pink);display:inline-block;margin-right:3px}.day small{font-size:10px;color:var(--muted);line-height:1.2}.calendar-wrap{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:16px}.session{padding:12px 0;border-bottom:1px solid var(--line)}.session:last-child{border-bottom:0}.overlay{position:fixed;inset:0;background:#070a13cc;display:flex;justify-content:center;align-items:flex-start;padding:20px;overflow:auto;z-index:10}.modal{background:#1c2134;border:1px solid #4b4d68;border-radius:22px;padding:25px;width:min(690px,100%);margin:auto;box-shadow:0 24px 80px #0008}.modal h2{margin:0 0 14px}.field{display:flex;flex-direction:column;gap:5px;margin:11px 0}.field label{font-size:12px;color:var(--muted);font-weight:700}input,select,textarea{width:100%;background:#121629;border:1px solid #42465d;color:white;border-radius:10px;padding:10px;min-width:0}input:focus,select:focus{outline:2px solid var(--purple)}.formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.exercise-edit{background:#252a40;border-radius:14px;padding:13px;margin:12px 0}.exercise-edit .formgrid{grid-template-columns:2fr repeat(3,1fr)}.exercise-run{background:#252a40;border-radius:14px;padding:15px;margin:12px 0}.sets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.set{background:#15192c;color:white;border:1px solid #4a5069;border-radius:11px;padding:9px 13px;font-weight:800}.set.done{background:var(--lime);color:#141820;border-color:var(--lime)}.progress{height:9px;background:#35394c;border-radius:20px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:linear-gradient(90deg,var(--purple),var(--lime));transition:width .2s}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.footer{color:#747d9c;text-align:center;padding:32px 0;font-size:12px}@media(max-width:780px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}.calendar-wrap{grid-template-columns:1fr}.hero{padding:22px}}@media(max-width:540px){.shell{padding:14px}.grid{grid-template-columns:1fr}.tabs{width:100%;justify-content:space-between}.tabs button{padding:9px}.day{min-height:64px;padding:5px}.day small{display:none}.formgrid,.exercise-edit .formgrid{grid-template-columns:repeat(2,1fr)}.hero{margin-top:18px}.modal{padding:17px}}

.insights-top{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.insights-top button.active{background:var(--lime);color:#151826}.insight-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px;margin:18px 0}.insight-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}.insight-card h3{margin:0 0 12px}.big-number{font-size:32px;font-weight:850}.chart-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}.chart-label{width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chart-track{flex:1;height:16px;border-radius:6px;background:#30354b;overflow:hidden}.chart-fill{height:100%;border-radius:6px;min-width:0}.chart-count{width:30px;text-align:right}.donut{width:165px;height:165px;border-radius:50%;position:relative;display:grid;place-items:center;margin:12px auto}.donut:after{content:'';position:absolute;inset:32px;border-radius:50%;background:var(--panel)}.donut-center{position:relative;z-index:1;font-weight:800;font-size:26px}.legend-row{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}.legend-dot{height:10px;width:10px;border-radius:50%;flex-shrink:0}.rating-stars{display:flex;flex-wrap:wrap;gap:5px;margin:14px 0}.rating-stars button{width:39px;height:39px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:#737991;font-size:22px}.rating-stars button.chosen{background:#483e29;color:#ffd166;border-color:#ffd166}.rating-label{font-size:17px;font-weight:750;color:var(--lime)}.insight-note{font-size:12px;color:var(--muted)}@media(max-width:600px){.rating-stars button{width:31px;height:36px;font-size:18px}.insight-card{padding:15px}}
 .log-note{white-space:pre-wrap;color:var(--muted);font-size:13px;margin-top:6px}.activity-tag{color:var(--blue);font-size:12px;font-weight:750}textarea{resize:vertical;min-height:85px} </style></head><body><div class="shell"><header class="top"><div><div class="eyebrow">Your training, your way</div><div class="brand">STATUE<span> OF DAVE</span></div></div><nav class="tabs" aria-label="Main navigation"><button data-tab="dashboard" class="active">Overview</button><button data-tab="library">Workouts</button><button data-tab="calendar">Calendar</button><button data-tab="insights">Insights</button></nav></header><main id="view"></main><footer class="footer">Stored locally on this device · Export a backup to keep your data safe</footer></div><div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div><script>
(()=>{'use strict';const KEY='form-workout-studio-v1';const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());const localDate=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const sample=[{id:uid(),name:'Full Body Strength',category:'Strength',favorite:true,exercises:[{id:uid(),name:'Squats',sets:3,reps:'10',weight:'',rest:90},{id:uid(),name:'Push-ups',sets:3,reps:'12',weight:'',rest:60},{id:uid(),name:'Bent-over Rows',sets:3,reps:'10',weight:'',rest:75}]},{id:uid(),name:'Leg Day Burner',category:'Bodyweight',favorite:true,exercises:[{id:uid(),name:'Bodyweight Squats',sets:4,reps:'25',weight:'',rest:45},{id:uid(),name:'Reverse Lunges',sets:3,reps:'12/leg',weight:'',rest:45},{id:uid(),name:'Calf Raises',sets:3,reps:'20',weight:'',rest:30}]},{id:uid(),name:'Core & Mobility',category:'Mobility',favorite:false,exercises:[{id:uid(),name:'Plank',sets:3,reps:'45 sec',weight:'',rest:30},{id:uid(),name:'Dead Bug',sets:3,reps:'12/side',weight:'',rest:30},{id:uid(),name:'Hip Flexor Stretch',sets:2,reps:'60 sec/side',weight:'',rest:15}]}];let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.workouts)||!Array.isArray(data.history))data={workouts:sample,history:[],active:null};data.activityTypes=Array.isArray(data.activityTypes)?data.activityTypes:[];data.history.forEach(h=>{if(h.manual&&h.category&&!data.activityTypes.some(c=>c.toLowerCase()===h.category.toLowerCase()))data.activityTypes.push(h.category)});let tab='dashboard',month=new Date();month.setDate(1);let selected=localDate();let favOnly=false;let insightRange='fortnight';let pendingRating=7;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Browser storage is full or unavailable. Export a backup.')}};const activityCategories=()=>[...new Set([...data.activityTypes,...data.history.filter(h=>h.manual).map(h=>h.category)].filter(Boolean))].sort((a,b)=>a.localeCompare(b));const sessionDetail=h=>h.manual?`${Number(h.durationMin)||0} min · ${h.effort?'★ '+h.effort+'/10 effort':'Not rated'}`:`${h.completedSets||0} / ${h.totalSets||0} sets · ${h.durationMin||0} min · ${h.effort?'★ '+h.effort+'/10 effort':'Not rated'}`;const workout=id=>data.workouts.find(w=>w.id===id);const allsets=a=>a.exercises.reduce((n,e)=>n+e.sets,0);const dateLabel=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});function card(w){return `<article class="card workout-card"><div class="row"><span class="pill">${esc(w.category)}</span><button class="fav ${w.favorite?'on':''}" data-action="fav" data-id="${w.id}" aria-label="Toggle favourite">${w.favorite?'♥':'♡'}</button></div><div><h3>${esc(w.name)}</h3><p>${w.exercises.length} exercises · ${allsets(w)} sets</p></div><div class="muted" style="font-size:13px">${esc(w.exercises.map(e=>e.name).slice(0,3).join(' · '))}</div><div class="actions"><button class="btn small" data-action="start" data-id="${w.id}">Start workout</button><button class="btn secondary small" data-action="edit" data-id="${w.id}">Edit</button><button class="btn ghost small" data-action="duplicate" data-id="${w.id}">Copy</button></div></article>`}function dashboard(){const today=new Date(),weekStart=new Date(today);weekStart.setDate(today.getDate()-((today.getDay()+6)%7));const wk=localDate(weekStart);const week=data.history.filter(h=>h.date>=wk&&h.date<=localDate());const days=[...new Set(data.history.map(h=>h.date))].sort().reverse();let streak=0;if(days.length){let cursor=new Date(localDate()+'T12:00:00');if(!days.includes(localDate()))cursor.setDate(cursor.getDate()-1);while(days.includes(localDate(cursor))){streak++;cursor.setDate(cursor.getDate()-1)}}return `<section class="hero"><div><div class="eyebrow" style="color:#413458">YOUR WORKOUT SPACE</div><h1>Make every rep count.</h1><p>Build your routines. Track your sessions. Keep showing up.</p></div><div class="toolbar"><button class="btn" data-action="create">+ New workout</button><button class="btn secondary" data-action="log-activity">+ Log activity</button></div></section><section class="stats"><div class="stat"><div class="eyebrow">This week</div><div class="number">${week.length}</div><div class="muted">sessions</div></div><div class="stat"><div class="eyebrow">Total sessions</div><div class="number">${data.history.length}</div><div class="muted">completed</div></div><div class="stat"><div class="eyebrow">Current streak</div><div class="number">${streak}</div><div class="muted">days</div></div><div class="stat"><div class="eyebrow">Favourites</div><div class="number">${data.workouts.filter(w=>w.favorite).length}</div><div class="muted">saved routines</div></div></section>${data.active?`<div class="card" style="margin-top:18px;border-color:var(--lime)"><div class="row"><div><b>Workout in progress</b><div class="muted">${esc(data.active.name)}</div></div><button class="btn" data-action="resume">Resume →</button></div></div>`:''}<div class="sectionhead"><h2>Go-to workouts</h2><button class="btn ghost small" data-action="go-library">View all</button></div><div class="grid">${data.workouts.filter(w=>w.favorite).slice(0,3).map(card).join('')||'<div class="card muted">Favourite workouts to see them here.</div>'}</div><div class="sectionhead"><h2>Recent activity</h2><button class="btn ghost small" data-action="go-calendar">Open calendar</button></div><div class="card">${data.history.slice().sort((a,b)=>b.finishedAt.localeCompare(a.finishedAt)).slice(0,4).map(h=>`<div class="session row"><div><b>${esc(h.name)}</b><div class="muted">${dateLabel(h.date)} · ${h.manual?esc(h.category)+' · '+(h.durationMin||0)+' min':(h.completedSets||0)+' sets'}</div></div><span class="pill">${h.effort?'★ '+h.effort+'/10':'Done ✓'}</span></div>`).join('')||'<div class="muted">Your completed sessions will appear here.</div>'}</div>`}function library(){return `<div class="sectionhead"><div><div class="eyebrow">Your collection</div><h2>Workout recipes</h2></div><button class="btn" data-action="create">+ Create workout</button></div><div class="toolbar" style="margin-bottom:18px"><button class="btn ${!favOnly?'secondary':'ghost'} small" data-action="filter-all">All (${data.workouts.length})</button><button class="btn ${favOnly?'secondary':'ghost'} small" data-action="filter-fav">♥ Favourites (${data.workouts.filter(w=>w.favorite).length})</button><button class="btn ghost small" data-action="export">Export backup</button><button class="btn ghost small" data-action="import">Import backup</button><input type="file" id="import-file" accept="application/json,.json" class="hidden"></div><div class="grid">${data.workouts.filter(w=>!favOnly||w.favorite).map(card).join('')||'<div class="empty">No workouts here yet.</div>'}</div>`}function calendar(){const y=month.getFullYear(),m=month.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,daysIn=new Date(y,m+1,0).getDate();let cells='';for(let i=0;i<42;i++){const d=new Date(y,m,i-first+1),date=localDate(d),entries=data.history.filter(h=>h.date===date),other=d.getMonth()!==m;cells+=`<button class="day ${other?'other':''} ${date===localDate()?'today':''} ${selected===date?'selected':''}" data-action="day" data-date="${date}"><b>${d.getDate()}</b>${entries.length?`<div>${entries.slice(0,3).map(()=>'<span class="dot"></span>').join('')}</div><small>${esc(entries[0].name)}</small>`:''}</button>`}const selectedEntries=data.history.filter(h=>h.date===selected);return `<div class="sectionhead"><div><div class="eyebrow">Training journal</div><h2>Workout calendar</h2></div><div class="toolbar"><button class="btn ghost small" data-action="prev-month">←</button><b>${month.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button class="btn ghost small" data-action="next-month">→</button><button class="btn small" data-action="log-activity">+ Log activity</button></div></div><div class="calendar-wrap"><div class="card"><div class="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dayname">${d}</div>`).join('')}${cells}</div></div><aside class="card"><div class="eyebrow">Selected date</div><h2>${dateLabel(selected)}</h2>${selectedEntries.length?selectedEntries.map(h=>`<div class="session"><b>${esc(h.name)}</b><div class="muted">${esc(h.category||'Workout')} · ${sessionDetail(h)}</div>${h.notes?`<div class="log-note">${esc(h.notes)}</div>`:''}${h.manual?`<button class="btn ghost small" style="margin-top:8px" data-action="edit-activity" data-id="${h.id}">Edit log</button>`:''}<button class="btn ghost small" style="margin-top:8px" data-action="rate-session" data-id="${h.id}">${h.effort?'Edit effort':'Rate effort'}</button><button class="btn ghost small" style="margin-top:8px" data-action="delete-session" data-id="${h.id}">Remove log</button></div>`).join(''):'<p class="muted">No completed workouts logged for this day.</p>'}<div class="eyebrow" style="margin-top:25px">Total sessions logged</div><div style="font-size:32px;font-weight:900;color:var(--lime)">${data.history.length}</div></aside></div>`}const palette=['#fa70a6','#c6f477','#aa92ff','#76d8f9','#ffcf71','#ff8d7b','#7ae6c7'];
function barChart(items,unit=''){const max=Math.max(1,...items.map(x=>x[1]));return items.length?items.map(([name,n],i)=>`<div class="chart-row"><span class="chart-label" title="${esc(name)}">${esc(name)}</span><div class="chart-track"><div class="chart-fill" style="width:${100*n/max}%;background:${palette[i%palette.length]}"></div></div><b class="chart-count">${n}${unit}</b></div>`).join(''):'<p class="muted">No completed sessions yet.</p>'}
function donut(items){const total=items.reduce((a,x)=>a+x[1],0);if(!total)return '<p class="muted">Log an activity to see your breakdown.</p>';let at=0;const stops=items.map((x,i)=>{const a=at;at+=x[1]/total*100;return `${palette[i%palette.length]} ${a}% ${at}%`});return `<div class="donut" style="background:conic-gradient(${stops.join(',')})"><span class="donut-center">${total}</span></div>${items.map(([name,n],i)=>`<div class="legend-row"><span class="legend-dot" style="background:${palette[i%palette.length]}"></span><span>${esc(name)}</span><span style="margin-left:auto">${n} · ${Math.round(n/total*100)}%</span></div>`).join('')}`}
function insights(){const today=localDate(),start=new Date();start.setDate(start.getDate()-13);const hist=data.history.filter(h=>insightRange==='all'||h.date>=localDate(start)&&h.date<=today);const rated=hist.filter(h=>Number.isFinite(Number(h.effort))&&Number(h.effort)>=1&&Number(h.effort)<=10);const avg=rated.length?(rated.reduce((a,h)=>a+Number(h.effort),0)/rated.length).toFixed(1):'—';const cats={};const names={};hist.forEach(h=>{const cat=h.category||workout(h.workoutId)?.category||'Other';cats[cat]=(cats[cat]||0)+1;names[h.name]=(names[h.name]||0)+1});const catItems=Object.entries(cats).sort((a,b)=>b[1]-a[1]);const nameItems=Object.entries(names).sort((a,b)=>b[1]-a[1]).slice(0,7);const effortBuckets=Array.from({length:10},(_,i)=>[String(i+1),rated.filter(h=>Number(h.effort)===i+1).length]);const dayItems=Array.from({length:14},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(13-i));const date=localDate(d);return [d.toLocaleDateString(undefined,{month:'numeric',day:'numeric'}),hist.filter(h=>h.date===date).length]});const totalMin=hist.reduce((a,h)=>a+(Number(h.durationMin)||0),0);const uniqueDays=new Set(hist.map(h=>h.date)).size;return `<div class="sectionhead"><div><div class="eyebrow">TRAINING ANALYTICS</div><h2>Your progress in colour</h2></div></div><div class="insights-top"><button class="btn small ${insightRange==='fortnight'?'active':'secondary'}" data-action="range-fortnight">Last 14 days</button><button class="btn small ${insightRange==='all'?'active':'secondary'}" data-action="range-all">All time</button></div><section class="stats"><div class="stat"><div class="eyebrow">Sessions</div><div class="number">${hist.length}</div><div class="muted">completed</div></div><div class="stat"><div class="eyebrow">Active days</div><div class="number">${uniqueDays}</div><div class="muted">days trained</div></div><div class="stat"><div class="eyebrow">Training time</div><div class="number">${totalMin}</div><div class="muted">minutes</div></div><div class="stat"><div class="eyebrow">Average effort</div><div class="number">${avg}</div><div class="muted">out of 10 · ${rated.length} rated</div></div></section><div class="insight-grid"><article class="insight-card"><h3>Activity mix</h3>${donut(catItems)}</article><article class="insight-card"><h3>Most logged activities</h3>${barChart(nameItems)}</article><article class="insight-card"><h3>Effort distribution</h3>${barChart(effortBuckets)}<p class="insight-note">Self-rated effort from 1 (very easy) to 10 (maximal).</p></article><article class="insight-card"><h3>Daily activity · last 14 days</h3>${barChart(dayItems)}<p class="insight-note">Number of completed sessions per day.</p></article></div><div class="card"><h3>Recent rated sessions</h3>${hist.slice().sort((a,b)=>(b.finishedAt||'').localeCompare(a.finishedAt||'')).slice(0,8).map(h=>`<div class="session row"><div><b>${esc(h.name)}</b><div class="muted">${dateLabel(h.date)} · ${h.durationMin||0} min</div></div><button class="btn ghost small" data-action="rate-session" data-id="${h.id}">${h.effort?'★ '+h.effort+'/10':'Rate'}</button></div>`).join('')||'<p class="muted">Your completed workouts will appear here.</p>'}</div>`}
function activityDialog(id){const h=id?data.history.find(x=>x.id===id):null;const types=activityCategories();const chosen=h?.category||types[0]||'';modal(`<div class="row"><div><div class="eyebrow">TRAINING JOURNAL</div><h2>${h?'Edit activity':'Log an activity'}</h2></div><button class="btn ghost small" data-action="close">✕</button></div><form id="activity-form" data-id="${h?.id||''}"><div class="field"><label>Date</label><input type="date" name="date" required value="${esc(h?.date||selected)}"></div><div class="field"><label>Activity category</label><select id="activity-category" name="categoryChoice"><option value="__new__" ${!chosen?'selected':''}>+ New activity type…</option>${types.map(c=>`<option value="${esc(c)}" ${c===chosen?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field ${chosen?'hidden':''}" id="new-activity-wrap"><label>New activity type</label><input name="newCategory" maxlength="60" placeholder="e.g. Yoga, Swimming, Boxing, Skipping" value=""></div><div class="field"><label>Duration (minutes)</label><input type="number" name="duration" min="1" max="1440" required value="${h?.durationMin||30}"></div><div class="field"><label>Effort · <span id="activity-effort-label">${h?.effort||5}/10</span></label><input type="range" name="effort" min="1" max="10" step="1" value="${h?.effort||5}" style="accent-color:var(--pink)"></div><div class="field"><label>Notes (optional)</label><textarea name="notes" maxlength="2000" placeholder="How did it go?">${esc(h?.notes||'')}</textarea></div><div class="toolbar"><button type="submit" class="btn">${h?'Save changes':'Save activity'}</button><button type="button" class="btn ghost" data-action="close">Cancel</button></div></form>`)}
function ratingDialog(id){const h=data.history.find(x=>x.id===id);if(!h)return;pendingRating=Number(h.effort)||7;modal(`<div class="row"><div><div class="eyebrow">SESSION REFLECTION</div><h2>How hard was it?</h2></div><button class="btn ghost small" data-action="close">✕</button></div><p class="muted">${esc(h.name)} · ${dateLabel(h.date)}</p><p>Rate your overall effort from 1 (very easy) to 10 (maximal).</p><div class="rating-stars" id="rating-stars">${Array.from({length:10},(_,i)=>`<button type="button" data-action="choose-rating" data-rating="${i+1}" class="${i<pendingRating?'chosen':''}" aria-label="Effort ${i+1} out of 10">★</button>`).join('')}</div><div class="rating-label" id="rating-label">${pendingRating} / 10</div><div class="toolbar" style="margin-top:20px"><button class="btn" data-action="save-rating" data-id="${h.id}">Save effort</button><button class="btn ghost" data-action="close">Cancel</button></div>`)}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#view').innerHTML=tab==='dashboard'?dashboard():tab==='library'?library():tab==='calendar'?calendar():insights()}function modal(html){$('#modal').innerHTML=html;$('#overlay').classList.remove('hidden')}function close(){$('#overlay').classList.add('hidden');$('#modal').innerHTML=''}function exerciseForm(e={},i=0){return `<div class="exercise-edit" data-exercise><div class="row"><b>Exercise ${i+1}</b><button type="button" class="btn ghost small" data-action="remove-exercise">Remove</button></div><div class="field"><label>Exercise name</label><input data-field="name" value="${esc(e.name||'')}" placeholder="e.g. Goblet squats" required></div><div class="formgrid"><div class="field"><label>Sets</label><input data-field="sets" type="number" min="1" max="100" value="${e.sets||3}" required></div><div class="field"><label>Reps / time</label><input data-field="reps" value="${esc(e.reps||'10')}" required></div><div class="field"><label>Weight / load</label><input data-field="weight" value="${esc(e.weight||'')}" placeholder="e.g. 20 kg"></div><div class="field"><label>Rest (sec)</label><input data-field="rest" type="number" min="0" value="${e.rest??60}"></div></div></div>`}let editing=null;function edit(id){const w=id?workout(id):null;editing=id||null;modal(`<div class="row"><h2>${w?'Edit workout':'New workout'}</h2><button class="btn ghost small" data-action="close">✕</button></div><form id="workout-form"><div class="field"><label>Workout name</label><input name="name" required maxlength="90" value="${esc(w?.name||'')}" placeholder="e.g. Upper body A"></div><div class="field"><label>Category</label><select name="category">${['Strength','Bodyweight','Cardio','Mobility','HIIT','Other'].map(c=>`<option ${w?.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="sectionhead"><h2>Exercises</h2><button type="button" class="btn secondary small" data-action="add-exercise">+ Add exercise</button></div><div id="exercise-list">${(w?.exercises||[{name:'',sets:3,reps:'10',weight:'',rest:60}]).map(exerciseForm).join('')}</div><div class="toolbar" style="margin-top:20px"><button class="btn" type="submit">Save workout</button><button type="button" class="btn ghost" data-action="close">Cancel</button>${w?`<button type="button" class="btn danger" data-action="delete-workout" data-id="${w.id}">Delete</button>`:''}</div></form>`)}function run(){const a=data.active;if(!a)return;const total=allsets(a),done=Object.values(a.checked).filter(Boolean).length;modal(`<div class="row"><div><div class="eyebrow">Session in progress</div><h2>${esc(a.name)}</h2></div><button class="btn ghost small" data-action="close">Minimise</button></div><div class="row"><span class="muted">${done} of ${total} sets complete</span><b>${total?Math.round(done/total*100):0}%</b></div><div class="progress"><div style="width:${total?done/total*100:0}%"></div></div>${a.exercises.map((e,i)=>`<div class="exercise-run"><div class="row"><div><b>${i+1}. ${esc(e.name)}</b><div class="muted">${esc(e.reps)} reps/time ${e.weight?'· '+esc(e.weight):''} · ${e.rest}s rest</div></div><span class="pill">${e.sets} sets</span></div><div class="sets">${Array.from({length:e.sets},(_,j)=>`<button class="set ${a.checked[e.id+':'+j]?'done':''}" data-action="toggle-set" data-key="${e.id}:${j}" aria-pressed="${!!a.checked[e.id+':'+j]}">${a.checked[e.id+':'+j]?'✓ ':''}Set ${j+1}</button>`).join('')}</div></div>`).join('')}<div class="toolbar"><button class="btn" data-action="finish" ${done!==total?'disabled':''}>Complete workout ✓</button><button class="btn danger" data-action="discard">Discard session</button></div><p class="muted" style="font-size:12px">All sets must be checked before completing. Your progress is saved automatically.</p>`)}function start(id){if(data.active){if(!confirm('Discard your current workout and start a new one?'))return}const w=workout(id);if(!w)return;data.active={id:w.id,name:w.name,exercises:structuredClone(w.exercises),checked:{},startedAt:new Date().toISOString()};save();run()}function finish(){const a=data.active;if(!a)return;const total=allsets(a),done=Object.values(a.checked).filter(Boolean).length;if(done!==total)return;const now=new Date();data.history.push({id:uid(),workoutId:a.id,name:a.name,date:localDate(now),finishedAt:now.toISOString(),durationMin:Math.max(1,Math.round((now-new Date(a.startedAt))/60000)),completedSets:done,totalSets:total,category:workout(a.id)?.category||"Other",exercises:structuredClone(a.exercises)});data.active=null;save();close();tab='calendar';selected=localDate();month=new Date();month.setDate(1);render();ratingDialog(data.history[data.history.length-1].id)}document.addEventListener('click',ev=>{const nav=ev.target.closest('[data-tab]');if(nav){tab=nav.dataset.tab;render();return}const b=ev.target.closest('[data-action]');if(!b)return;const {action,id}=b.dataset;if(action==='range-fortnight'){insightRange='fortnight';render()}else if(action==='range-all'){insightRange='all';render()}else if(action==='rate-session')ratingDialog(id);else if(action==='log-activity')activityDialog();else if(action==='edit-activity')activityDialog(id);else if(action==='choose-rating'){pendingRating=Number(b.dataset.rating);document.querySelectorAll('#rating-stars button').forEach(x=>x.classList.toggle('chosen',Number(x.dataset.rating)<=pendingRating));$('#rating-label').textContent=pendingRating+' / 10'}else if(action==='save-rating'){const h=data.history.find(x=>x.id===id);if(h){h.effort=pendingRating;save()}close();render()}else if(action==='create')edit();else if(action==='edit')edit(id);else if(action==='close')close();else if(action==='fav'){const w=workout(id);w.favorite=!w.favorite;save();render()}else if(action==='start')start(id);else if(action==='resume')run();else if(action==='go-library'){tab='library';render()}else if(action==='go-calendar'){tab='calendar';render()}else if(action==='filter-all'){favOnly=false;render()}else if(action==='filter-fav'){favOnly=true;render()}else if(action==='duplicate'){const w=structuredClone(workout(id));w.id=uid();w.name+=' (copy)';w.favorite=false;w.exercises.forEach(e=>e.id=uid());data.workouts.push(w);save();render()}else if(action==='add-exercise'){const el=$('#exercise-list');el.insertAdjacentHTML('beforeend',exerciseForm({},el.children.length))}else if(action==='remove-exercise'){b.closest('[data-exercise]').remove()}else if(action==='delete-workout'){if(confirm('Delete this workout recipe? Existing calendar history will remain.')){data.workouts=data.workouts.filter(w=>w.id!==id);save();close();render()}}else if(action==='toggle-set'){data.active.checked[b.dataset.key]=!data.active.checked[b.dataset.key];save();run()}else if(action==='finish')finish();else if(action==='discard'){if(confirm('Discard this active workout?')){data.active=null;save();close();render()}}else if(action==='prev-month'||action==='next-month'){month.setMonth(month.getMonth()+(action==='prev-month'?-1:1));render()}else if(action==='day'){selected=b.dataset.date;render()}else if(action==='delete-session'){if(confirm('Remove this session from your calendar?')){data.history=data.history.filter(h=>h.id!==id);save();render()}}else if(action==='export'){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='form-workout-backup-'+localDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}else if(action==='import')$('#import-file').click()});document.addEventListener('submit',ev=>{if(ev.target.id==='activity-form'){ev.preventDefault();const f=ev.target;const choice=f.elements.categoryChoice.value;const category=(choice==='__new__'?f.elements.newCategory.value:choice).trim().replace(/\s+/g,' ');const duration=Number(f.elements.duration.value),effort=Number(f.elements.effort.value),date=f.elements.date.value;if(!category||category.length>60||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isInteger(duration)||duration<1||duration>1440||effort<1||effort>10){alert('Enter a valid category, date, duration and effort.');return}const existing=data.activityTypes.find(c=>c.toLowerCase()===category.toLowerCase());const cat=existing||category;if(!existing)data.activityTypes.push(cat);const id=f.dataset.id;const h=id?data.history.find(x=>x.id===id):null;const entry={id:id||uid(),manual:true,name:cat,category:cat,date,durationMin:duration,effort,notes:f.elements.notes.value.trim(),finishedAt:date+'T12:00:00',completedSets:0,totalSets:0};if(h)Object.assign(h,entry);else data.history.push(entry);selected=date;month=new Date(date+'T12:00:00');month.setDate(1);save();close();tab='calendar';render();return}if(ev.target.id!=='workout-form')return;ev.preventDefault();const form=ev.target;const exercises=[...form.querySelectorAll('[data-exercise]')].map(x=>({id:uid(),name:x.querySelector('[data-field=name]').value.trim(),sets:Number(x.querySelector('[data-field=sets]').value),reps:x.querySelector('[data-field=reps]').value.trim(),weight:x.querySelector('[data-field=weight]').value.trim(),rest:Number(x.querySelector('[data-field=rest]').value)}));if(!exercises.length||exercises.some(e=>!e.name||!e.reps||e.sets<1||e.sets>100||e.rest<0)){alert('Add at least one valid exercise.');return}const prev=editing?workout(editing):null;const w={id:editing||uid(),name:form.elements.name.value.trim(),category:form.elements.category.value,favorite:prev?.favorite||false,exercises};if(!w.name)return;if(prev)Object.assign(prev,w);else data.workouts.push(w);save();close();tab='library';render()});document.addEventListener('input',ev=>{if(ev.target.matches('#activity-form [name=effort]'))$('#activity-effort-label').textContent=ev.target.value+'/10'});document.addEventListener('change',async ev=>{if(ev.target.id==='activity-category'){const wrap=$('#new-activity-wrap');wrap.classList.toggle('hidden',ev.target.value!=='__new__');return}if(ev.target.id!=='import-file')return;const file=ev.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!Array.isArray(obj.workouts)||!Array.isArray(obj.history)||obj.workouts.some(w=>!Array.isArray(w.exercises)))throw Error('Invalid backup');if(confirm('Replace all current workouts and history with this backup?')){data={workouts:obj.workouts,history:obj.history,active:obj.active||null,activityTypes:Array.isArray(obj.activityTypes)?obj.activityTypes:[]};data.history.filter(h=>h.manual&&h.category).forEach(h=>{if(!data.activityTypes.some(c=>c.toLowerCase()===h.category.toLowerCase()))data.activityTypes.push(h.category)});save();render()}}catch(e){alert('Could not import: '+e.message)}});render()})();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn))}</script></body></html>
